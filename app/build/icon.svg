<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
    <defs>
      <linearGradient id="tile" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#222a35"/>
        <stop offset="1" stop-color="#0b0e13"/>
      </linearGradient>
      <!-- green (host) flows into blue (container) so the arc merges both nodes -->
      <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#56d364"/>
        <stop offset="0.55" stop-color="#59c3a0"/>
        <stop offset="1" stop-color="#58a6ff"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)" stroke="#2f3742" stroke-width="2"/>
    <rect x="9" y="9" width="238" height="118" rx="53" fill="#ffffff" opacity="0.03"/>
    <!-- soft neon halo -->
    <g filter="url(#glow)" opacity="0.65">
    <path d="M48 170 C 74 170 84 86 98 80 C 118 106 138 106 158 80 C 172 86 182 170 208 170" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="48" cy="170" r="16" fill="#56d364"/>
    <rect x="192" y="154" width="32" height="32" rx="9" fill="#58a6ff"/></g>
    <!-- crisp mark -->
    
    <path d="M48 170 C 74 170 84 86 98 80 C 118 106 138 106 158 80 C 172 86 182 170 208 170" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="48" cy="170" r="16" fill="#56d364"/>
    <rect x="192" y="154" width="32" height="32" rx="9" fill="#58a6ff"/>
  </svg>